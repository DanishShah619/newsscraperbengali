name: Daily Bengal News Digest

on:
  schedule:
    # Runs at 03:30 UTC every day (9:00 AM IST)
    - cron: '30 3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  run-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'bengal-digest/bengal-digest/requirements.txt'

      - name: Install dependencies
        run: |
          pip install -r bengal-digest/bengal-digest/requirements.txt

      - name: Run Bengal Digest Pipeline
        working-directory: bengal-digest/bengal-digest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BBC_API_BASE: ${{ secrets.BBC_API_BASE }}
        run: |
          python run_digest.py
