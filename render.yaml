services:
  - type: cron
    name: bengal-digest
    runtime: python
    rootDir: bengal-digest/bengal-digest
    schedule: "30 3 * * *"          # 9:00 AM IST — Render runs cron in UTC
    buildCommand: pip install -r requirements.txt
    startCommand: python run_digest.py
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bengal-digest-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: BBC_API_BASE
        sync: false

databases:
  - name: bengal-digest-db
    plan: free
    region: singapore           # closest to India; change to frankfurt if you prefer EU
